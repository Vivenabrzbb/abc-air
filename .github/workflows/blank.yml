name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.9.0
        with:
          target: 'https://abc-air.pythonanywhere.com'
          cmd_options: '-a'
          artifact_name: zap_report-${{ github.run_number }}   # ← new line

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.9.0
        with:
          target: 'https://abc-air.pythonanywhere.com'
          cmd_options: '-a'
